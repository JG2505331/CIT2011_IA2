
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Coding Conf Ticket</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/ticket.js" defer></script>
</head>
<body>

    <header>
        <h1>Coding Conf 2026</h1>
        <p>Your ticket is ready!</p>
    </header>

    <main>
        <section class="ticket">
            <h2>Congrats, <span id="ticketName">Guest</span>! Your ticket is ready.</h2>

            <div class="ticket-details">
                <p class="ticket-label">EVENT</p>
                <h3>Coding Conf 2026</h3>

                <p class="ticket-label">DATE</p>
                <p>October 26, 2026</p>

                <p class="ticket-label">LOCATION</p>
                <p>Papine, Kingston, Jamaica</p>

                <p class="ticket-label">TICKET</p>
                <p id="ticketNumber">#01609</p>
            </div>

            <div class="attendee-details">
                <img id="ticketAvatar" src="" alt="Your profile picture">

                <div>
                    <h3 id="ticketFullName">Your Name</h3>

                    <p class="ticket-label">GITHUB</p>
                    <p>
                        <a id="ticketGithub" href="#" target="_blank" rel="noopener noreferrer">@username</a>
                    </p>

                    <p class="ticket-label">EMAIL</p>
                    <p id="ticketEmail">your@email.com</p>
                </div>
            </div>
        </section>
            <div class="ticket-back">
                <a href="index.html" class="register-button">← Back to Home</a>
            </div>

    </main>

</body>
</html>
