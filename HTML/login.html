<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coding Conf Registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <script src="../js/validation.js" defer></script>
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="logo" aria-label="Coding Conf homepage">
            <img src="../assets/images/logo-full.svg" alt="Coding Conf">
        </a>
    </header>

    <main>
        <section class="hero">

            <div class="form-heading">
                <h1>
                    Secure your spot at next year's biggest coding conference.
                </h1>

                <p>
                    Register below to get your personalized ticket for Coding Conf 2026.
                </p>
            </div>

            <form id="registrationForm" class="registration-form">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="github">GitHub Username</label>

                    <input
                        type="text"
                        id="github"
                        name="github"
                        placeholder="@username"
                        required
                    >
                </div>

                <div class="form-group avatar-group">

                    <label for="avatar">Upload Avatar</label>

                    <div class="avatar-upload-box" id="avatarDropzone">

                        <input
                            type="file"
                            id="avatar"
                            name="avatar"
                            accept=".jpg,.jpeg,.png"
                            required
                        >

                        <div class="avatar-upload-content" id="uploadContent">

                            <img
                                src="../assets/images/icon-upload.svg"
                                alt=""
                                class="upload-icon"
                            >

                            <span>Drag and drop or click to upload</span>

                        </div>

                    </div>

                    <div class="avatar-preview" id="avatarPreview" hidden>

                        <img
                            id="previewImage"
                            src=""
                            alt="Preview of your uploaded avatar"
                        >

                        <div class="avatar-preview-details">
                            <p id="avatarFileName"></p>

                            <div class="avatar-actions">
                                <button type="button" id="changeImage">
                                    Change Image
                                </button>

                                <button type="button" id="removeImage">
                                    Remove Image
                                </button>
                            </div>
                        </div>

                    </div>

                    <p class="form-help" id="avatarHelp">
                        <img src="../assets/images/icon-info.svg" alt="">
                        Upload your photo (JPG or PNG, max size: 500KB).
                    </p>

                </div>

                <p id="errorMessage" class="error-message" role="alert" aria-live="polite"></p>

                <button type="submit" class="register-button">
                    Generate My Ticket
                </button>

            </form>

        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>

</body>

</html>
